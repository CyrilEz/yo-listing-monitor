<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>YO Listing Monitor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111827;
    color:#F3F4F6;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.card{
    background:#1F2937;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

h1{
    margin-top:0;
}

.status{
    font-size:26px;
    font-weight:bold;
}

.ok{
    color:#22C55E;
}

.bad{
    color:#EF4444;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.label{
    color:#9CA3AF;
    font-size:13px;
}

.value{
    margin-top:8px;
    font-size:22px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #374151;
    text-align:left;
}

th{
    color:#9CA3AF;
}

footer{
    text-align:center;
    margin-top:40px;
    color:#6B7280;
    font-size:12px;
}

.refresh{
    float:right;
    color:#9CA3AF;
    font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<h1>

YO Listing Monitor

<span class="refresh">
Actualisation auto : 30 sec
</span>

</h1>

<div class="card">

<div id="status" class="status">

Chargement...

</div>

</div>

<div class="grid">

<div class="card">

<div class="label">
Prix
</div>

<div id="price" class="value">
-
</div>

</div>

<div class="card">

<div class="label">
Dernier check
</div>

<div id="lastcheck" class="value" style="font-size:18px">
-
</div>

</div>

<div class="card">

<div class="label">
Nombre de CEX
</div>

<div id="nbcex" class="value">
-
</div>

</div>

<div class="card">

<div class="label">
Nombre de DEX
</div>

<div id="nbdex" class="value">
-
</div>

</div>

</div>

<div class="card">

<h2>CEX détectés</h2>

<table>

<thead>

<tr>

<th>Exchange</th>
<th>Pair</th>
<th>Prix</th>
<th>Volume</th>

</tr>

</thead>

<tbody id="cex">

</tbody>

</table>

</div>

<div class="card">

<h2>DEX détectés</h2>

<table>

<thead>

<tr>

<th>Exchange</th>
<th>Pair</th>

</tr>

</thead>

<tbody id="dex">

</tbody>

</table>

</div>

<footer>

YO Monitor • GitHub Pages

</footer>

</div>

<script>

async function refresh(){

    const r = await fetch("status.json?"+Date.now());

    const data = await r.json();

    document.getElementById("price").innerHTML=data.price;

    document.getElementById("lastcheck").innerHTML=data.last_check;

    document.getElementById("nbcex").innerHTML=data.cex.length;

    document.getElementById("nbdex").innerHTML=data.dex.length;

    if(data.listed){

        document.getElementById("status").innerHTML=
        "<span class='bad'>🚨 LISTÉ SUR UN CEX</span>";

    }else{

        document.getElementById("status").innerHTML=
        "<span class='ok'>🟢 Pas de listing CEX</span>";

    }

    let html="";

    data.cex.forEach(e=>{

        html+=`
        <tr>
            <td>${e.name}</td>
            <td>${e.pair}</td>
            <td>${e.price}</td>
            <td>${Math.round(e.volume).toLocaleString()}</td>
        </tr>`;

    });

    if(html==="")
        html="<tr><td colspan='4'>Aucun</td></tr>";

    document.getElementById("cex").innerHTML=html;

    html="";

    data.dex.forEach(e=>{

        html+=`
        <tr>
            <td>${e.name}</td>
            <td>${e.pair}</td>
        </tr>`;

    });

    document.getElementById("dex").innerHTML=html;

}

refresh();

setInterval(refresh,30000);

</script>

</body>

</html>
